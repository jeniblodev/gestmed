spring.application.name=notification

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3308/notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Repete o processamento quando o listener lança uma exceção
spring.rabbitmq.listener.simple.retry.enabled=true
# Total de tentativas, incluindo a primeira
spring.rabbitmq.listener.simple.retry.max-retries=3
# Espera inicial entre tentativas
spring.rabbitmq.listener.simple.retry.initial-interval=1000
# Multiplica o intervalo após cada falha
spring.rabbitmq.listener.simple.retry.multiplier=2.0
# Intervalo máximo entre tentativas
spring.rabbitmq.listener.simple.retry.max-interval=5000
# Após esgotar as tentativas, rejeita a mensagem.
# O RabbitMQ então a envia para a DLQ.
spring.rabbitmq.listener.simple.default-requeue-rejected=false